context: cloud-infrastructure
name: Cloud Infrastructure
intro: >-
  The common cloud-infrastructure vocabulary -- the instances that compute, the volumes and
  snapshots that store, the networks, firewalls and load balancers that connect, the SSH keys
  that let people in and the regions it all runs in -- distilled from the APIs that already
  exist.
tags: [Cloud, Cloud Computing, IaaS, Compute, Infrastructure, GPU, Data Center, Hosting, VPS, Bare Metal]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, items]

common_fields:
  id: [uuid, guid, object_id, record_id, slug, instance_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, creation_timestamp, launch_time, launched_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties, labels, tags]
  status: [state, power_state, instance_state, lifecycle_state, provisioning_state]
  name: [title, display_name, label, hostname, host_name]
  description: [notes, note, details]
  region: [region_id, region_slug, location, zone, datacenter, availability_zone, data_center, site]
  project_id: [project, tenant_id, account_id, organization_id, team_id]

concepts:
  instance:
    segments: [instances, instance, servers, droplets, droplet, virtual_machines, virtual-machines, virtualmachines, vms, vm, machines, compute_instances, linodes, pods@gpu]
    aliases:
      instance_type: [type, size, plan, flavor, machine_type, instance_type_id, size_slug, server_type, shape, gpu_type]
      image: [image_id, os, operating_system, image_slug, distribution, template]
      public_ip: [ip, ipv4, ip_address, main_ip, public_ip_address, public_ipv4, ip_addresses, networks]
      private_ip: [private_ip_address, internal_ip, private_ipv4]
      cpus: [vcpus, cpu, cpu_count, cores, vcpu_count]
      memory: [ram, memory_mb, memory_gb, ram_mb]
      disk: [disk_gb, disk_size, storage, root_disk]
  volume:
    requires: [instance]
    segments: [volumes, volume, disks, disk, block_storage, block-storage, blockstorage]
    aliases:
      size: [size_gb, size_gigabytes, capacity, disk_size]
      instance_id: [attached_to, server, server_id, droplet_ids, linode_id, attachments]
      type: [volume_type, storage_type, disk_type, filesystem_type]
  snapshot:
    requires: [instance]
    segments: [snapshots, snapshot, "backups@instances|servers|volumes|droplets|linodes|vms", images@instances|servers|compute]
    aliases:
      size: [size_gb, size_gigabytes, min_disk_size]
      source_id: [resource_id, volume_id, instance_id, server_id, source]
  network:
    requires: [instance]
    segments: [networks, network, vpcs, vpc, private_networks, private-networks, vnets, subnets]
    aliases:
      cidr: [ip_range, ip_cidr_range, subnet, address_space, cidr_block]
  firewall:
    requires: [instance]
    segments: [firewalls, firewall, security_groups, security-groups, securitygroups, firewall_rules, network_security_groups]
    aliases:
      rules: [inbound_rules, outbound_rules, ingress, egress, rule_set]
  load_balancer:
    requires: [instance]
    segments: [load_balancers, load-balancers, loadbalancers, nodebalancers, lbs]
    aliases:
      algorithm: [balancing_algorithm, method]
      targets: [backends, members, droplet_ids, servers, nodes, target_groups]
      ip: [public_ip, ip_address, vip]
  ssh_key:
    requires: [instance]
    segments: [ssh_keys, ssh-keys, sshkeys, keys@ssh|account, keypairs, key_pairs]
    aliases:
      public_key: [key, public_key_string, ssh_key]
      fingerprint: [fingerprints]
  region:
    requires: [instance]
    segments: [regions, region, locations@compute|instances|cloud, datacenters, data_centers, zones@compute]
    aliases:
      country: [country_code]
      available: [available_for_instances, status, availability]

duplicates:
  equinix: [packet-host]
  m0: [m-0]
  pingcap: [tidb]
  upsun: [platform.sh]
  sail: [sail-research]

findings:
  - "Cloud infrastructure agrees more than any other technical context: an SSH key (name,
    public key, fingerprint), a volume (size, type, status) and a load balancer (region,
    status) are shared almost completely across clouds, VPS hosts and GPU clouds."
  - "An instance agrees only on name, status, id and created_at: size, image and IP address
    are each named by every provider in its own way (size, plan, flavor, machine_type,
    shape)."
  - "Azure maps poorly however it is measured: Azure Resource Manager nests every field of
    every resource under `properties`, so the common names sit one level down."
decisions:
  - "An instance covers servers, droplets, virtual machines, Linodes and GPU pods; singular
    `/server` is a load-balancer backend or syslog target and does not count."
  - "A snapshot covers backups only beneath an instance, server or volume: database backups
    belong with the database."
  - "A network covers VPCs, private networks and subnets; a firewall covers security groups."
  - "Duplicates merged: Packet into Equinix, M0, TiDB into PingCAP, Platform.sh into Upsun,
    Sail."
